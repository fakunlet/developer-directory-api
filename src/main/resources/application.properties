spring.application.name=developer-directory-api

spring.datasource.url=jdbc:postgresql://localhost:5332/devdirectory
spring.datasource.username=devuser
spring.datasource.password=devpass

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Read from environment variables so no AWS credentials or bucket names are
# ever committed to the repository.
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket=${AWS_S3_BUCKET:}

# Reject oversized uploads at the web layer, before they reach S3.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
